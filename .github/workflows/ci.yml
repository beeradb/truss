# Build, vet, test, and refuse anything that identifies a real deployment.
#
# ⚠️ `pull_request`, NOT `pull_request_target`, and the difference is about
# what this workflow holds. The platform this engine came from uses
# `pull_request_target` because its plan job needs credentials, so it must run
# main's workflow rather than the PR's. Nothing here holds a credential, so
# running the PR's own workflow against the PR's own code is exactly right --
# and `pull_request_target` would be the more dangerous choice, because it
# would grant a writable token to a run over untrusted code.
#
# ⚠️ Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer
# somebody else controls; a SHA is the code that was reviewed. The trailing
# comment is the version the SHA stood for when it was pinned -- verified
# against the API, not copied from a README.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # leakscan reads `git log` for Co-Authored-By trailers, which a
          # depth-1 checkout cannot see past the tip commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # One pin, in go.mod, so the toolchain here and the toolchain a
          # developer runs cannot drift apart.
          go-version-file: go.mod

      - run: go build ./...
      - run: go vet ./...

      # ⚠️ jq IS A TEST DEPENDENCY, AND ITS ABSENCE MUST BE LOUD. The plan
      # digest has to be byte-identical to what `jq -S -c | sha256sum`
      # produces, and the only thing that proves it is a differential test
      # that runs the real pipeline. That test SKIPS when jq is missing --
      # so without this step a runner image that drops jq would leave CI
      # green on a comparison it never made.
      - run: jq --version

      # TRUSS_REQUIRE_JQ=1 turns that skip into a failure. Setting it here is
      # what makes the differential test mean something in CI.
      # ⚠️ -count=1 disables test caching, which actions/setup-go enables by
      # default (it caches GOCACHE, where Go stores test results). A PR that
      # does not change go.mod can restore stale cached results, silently
      # passing tests against broken code. See AGENTS.md.
      - run: go test -count=1 ./...
        env:
          TRUSS_REQUIRE_JQ: "1"

      # ⚠️ A SHORT FUZZ RUN, ON PURPOSE. The seed corpus only replays
      # divergences already found; fuzzing is what found them. Three genuine
      # ones came out of it, including a lone UTF-16 high surrogate that Go
      # accepts and jq refuses. Thirty seconds will not explore much, but a
      # new divergence is a real defect in the one value in this system that
      # must be exactly equal -- so failing here is the correct outcome, not
      # flakiness. -count=1 disables caching of the seed corpus, for the same
      # reason as the regular test step.
      - run: go test -count=1 ./internal/plan/ -run 'XXX_none' -fuzz FuzzCanonicalAgreesWithJQ -fuzztime 30s
        env:
          TRUSS_REQUIRE_JQ: "1"

      # ⚠️ IT IS THE STANDARD LIBRARY THIS SCANS, NOT DEPENDENCIES -- there are
      # none. go.mod is three lines and there is no go.sum (port-plan.md §7.1),
      # so what govulncheck can find here is a vulnerability in the stdlib or
      # toolchain that this code actually REACHES, which is precisely the class
      # a zero-dependency project cannot fix by bumping something. Reachability
      # is why it is this rather than a scanner: it reports call paths, not
      # advisories against a version number.
      #
      # ⚠️ Pinned, not @latest -- a tag is a mutable pointer somebody else
      # controls, and `@latest` is strictly worse than a tag. The module proxy
      # and checksum database verify what this fetches; nothing is added to
      # go.mod or go.sum, which is asserted by leakscan's own narrow exemption.
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

      # ⚠️ THE DASHBOARDS AND THE ALERTING RULES ARE THE HALF OF
      # observability/ THAT `go test` CANNOT REACH.
      # cmd/truss/metrics_contract_test.go checks that the metric NAMES a
      # panel mentions are ones truss emits -- which a syntactically broken
      # expression passes while being unparseable. A bad panel query renders
      # "No data", which is what a quiet week looks like; a bad rule makes
      # Prometheus reject the WHOLE file, silently disarming every other rule
      # beside it. And the dashboards speak two query languages, so
      # scripts/check-observability routes each query by its panel's
      # datasource: PromQL to promtool, LogQL to logcli.
      - uses: ./.github/actions/query-tools

      # TRUSS_REQUIRE_PROMTOOL=1 turns the script's local skip into a failure,
      # the same way TRUSS_REQUIRE_JQ=1 does for the digest differential test
      # above. A check that passes when its own tool is absent is not a check.
      # The same variable governs logcli, so the Loki dashboards cannot go
      # unchecked here either.
      - run: scripts/check-observability
        env:
          TRUSS_REQUIRE_PROMTOOL: "1"

      # ⚠️ THE SCANNER'S OWN TEST RUNS FIRST, AND THAT ORDER IS THE POINT.
      # A leak scan that has quietly stopped matching reports success, so the
      # question "does the guard still work" has to be answered before its
      # answer is trusted. Two of its patterns were once inert under this very
      # runner's grep while passing here in green.
      - run: scripts/leakscan-test
      - run: scripts/leakscan
