# Build, vet, test, and refuse anything that identifies a real deployment.
#
# ⚠️ `pull_request`, NOT `pull_request_target`, and the difference is about
# what this workflow holds. The platform this engine came from uses
# `pull_request_target` because its plan job needs credentials, so it must run
# main's workflow rather than the PR's. Nothing here holds a credential, so
# running the PR's own workflow against the PR's own code is exactly right --
# and `pull_request_target` would be the more dangerous choice, because it
# would grant a writable token to a run over untrusted code.
#
# ⚠️ Actions are pinned to commit SHAs, not tags. A tag is a mutable pointer
# somebody else controls; a SHA is the code that was reviewed. The trailing
# comment is the version the SHA stood for when it was pinned -- verified
# against the API, not copied from a README.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # leakscan reads `git log` for Co-Authored-By trailers, which a
          # depth-1 checkout cannot see past the tip commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # One pin, in go.mod, so the toolchain here and the toolchain a
          # developer runs cannot drift apart.
          go-version-file: go.mod

      # ⚠️ jq IS A TEST DEPENDENCY, AND ITS ABSENCE MUST BE LOUD. The plan
      # digest has to be byte-identical to what `jq -S -c | sha256sum`
      # produces, and the only thing that proves it is a differential test
      # that runs the real pipeline. That test SKIPS when jq is missing --
      # so without this step a runner image that drops jq would leave CI
      # green on a comparison it never made.
      - run: jq --version

      # ⚠️ tofu IS A TEST DEPENDENCY FOR THE SAME REASON jq IS, AND ITS
      # ABSENCE MUST BE JUST AS LOUD. internal/plan's declaration tests
      # generate real plan JSON and read it back, because the shape they
      # depend on -- a provisioner nested inside a module -- is a fact about
      # OpenTofu's output rather than about this code, and a hand-written
      # fixture would go on agreeing with itself after that shape changed.
      #
      # Those tests FAIL rather than skip when tofu is missing, which is what
      # turned this runner red the first time they ran here. Installing it is
      # the fix; making them skip would have been the fix that hides.
      #
      # ⚠️ VIA scripts/toolchain, NOT A THIRD-PARTY ACTION AND NOT A BARE
      # curl. The version is pinned in tofu-versions and the download is
      # checked against scripts/toolchain.sha256, so CI installs exactly what
      # a developer's machine does and neither reads a version the other
      # cannot see. docs/toolchain.md says CI does not run this script; that
      # was written when Go and jq were the whole list and both came from the
      # runner image, and tofu comes from neither.
      - run: |
          scripts/toolchain install tofu
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: tofu version

      # ⚠️ THE SAME SCRIPT A DEVELOPER RUNS BEFORE COMMITTING, not a second
      # copy of its steps -- and deliberately not a list of them either, since
      # a list here is a second statement of the order that drifts from the
      # one that runs. scripts/check says what it does and why, beside each
      # command. CI keeping a step this repository's own instructions had
      # dropped is exactly how that failure reads.
      #
      # TRUSS_REQUIRE_JQ=1 turns the digest differential test's skip into a
      # failure. Setting it here is what makes that test mean something in CI.
      # ⚠️ promtool AND logcli, because scripts/check runs check-observability
      # and the dashboards speak two query languages -- PromQL to promtool,
      # LogQL to logcli. Installed here so scripts/check can require them.
      - uses: ./.github/actions/query-tools

      - run: scripts/check
        env:
          TRUSS_REQUIRE_JQ: "1"
          # Turns check-observability's skip-without-promtool into a failure,
          # the same way TRUSS_REQUIRE_JQ does for the digest differential test.
          TRUSS_REQUIRE_PROMTOOL: "1"

      # ⚠️ A SHORT FUZZ RUN, ON PURPOSE. The seed corpus only replays
      # divergences already found; fuzzing is what found them. Three genuine
      # ones came out of it, including a lone UTF-16 high surrogate that Go
      # accepts and jq refuses. Thirty seconds will not explore much, but a
      # new divergence is a real defect in the one value in this system that
      # must be exactly equal -- so failing here is the correct outcome, not
      # flakiness. -count=1 disables caching of the seed corpus, for the same
      # reason as the regular test step.
      - run: go test -count=1 ./internal/plan/ -run 'XXX_none' -fuzz FuzzCanonicalAgreesWithJQ -fuzztime 30s
        env:
          TRUSS_REQUIRE_JQ: "1"

