# Publish a truss release: the static binaries, their checksums, and a runnable
# image per supported OpenTofu version.
#
# ⚠️ THIS EXISTS BECAUSE HAND-BUILT IMAGES BROKE A CONSUMER. The applier's
# image used to be built with podman on the single box that runs it, which
# made it the one thing in the system not delivered by merging: a config
# change could outrun its runtime, and only an SSH session could close the
# gap. On 2026-09-08 that took an applier down for hours, and the fix could
# not be shipped BY the applier. Every failure mode of that path -- wrong
# machine, wrong image name, podman absent, an amd64-only download on an arm64
# laptop -- is a failure mode this workflow does not have.
#
# ⚠️ ONE IMAGE PER OPENTOFU VERSION, AND THE VERSION IS IN THE TAG. A
# consumer's CI plans with one tofu version and its applier re-plans with the
# one in this image; if they differ, every plan digest mismatches and every
# apply is refused. Putting the version in the tag makes that pin explicit
# rather than a coincidence. Supported versions are listed in `tofu-versions`.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # leakscan reads `git log` for Co-Authored-By trailers, which a
          # depth-1 checkout cannot see past the tip commit.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # ⚠️ THE TAG IS TESTED AGAIN, NOT TRUSTED BECAUSE main WAS GREEN. A tag
      # can point at any commit, including one that never sat on main and
      # never passed ci.yml. A release is the artefact people run.
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: scripts/leakscan

      # ⚠️ -trimpath AND NO BUILD STAMP, SO THE CHECKSUM MEANS SOMETHING. A
      # binary carrying a build path or a timestamp differs on every machine,
      # which makes a published sha256 an assertion nobody can check.
      - name: Build
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "dist/truss-linux-$arch" ./cmd/truss
          done

      # ⚠️ A CHECK THAT CAN FAIL, rather than a claim in a comment. If a future
      # change embeds a path or a timestamp this goes red at release time,
      # instead of quietly making every published checksum unverifiable.
      - name: Prove the build is reproducible
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -o "recheck-$arch" ./cmd/truss
            cmp "dist/truss-linux-$arch" "recheck-$arch" \
              || { echo "build is not reproducible for $arch -- a published checksum would be unverifiable" >&2; exit 1; }
            rm -f "recheck-$arch"
          done

      - name: Checksums
        run: (cd dist && sha256sum truss-linux-amd64 truss-linux-arm64 > SHA256SUMS)

      # ⚠️ amd64 ONLY, DELIBERATELY, AND THE arm64 BINARY IS STILL PUBLISHED.
      # A multi-arch image needs QEMU on the runner, which means third-party
      # actions this repository has otherwise avoided (see `gh` below, used in
      # place of a release action). No consumer runs an arm64 cluster today.
      # Adding it later is a --platform list here plus binfmt; the Dockerfile
      # already reads TARGETARCH and needs no change.
      - name: Build and push images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          while read -r tofu; do
            [ -n "$tofu" ] || continue
            tag="${IMAGE}:${GITHUB_REF_NAME}-tofu${tofu}"
            echo "::group::$tag"
            docker build --build-arg "OPENTOFU_VERSION=${tofu}" --build-arg TARGETARCH=amd64 -t "$tag" .
            docker push "$tag"
            # The digest is what a consumer pins; printing it here means it can
            # be read off the release without a registry round-trip.
            docker inspect --format '{{index .RepoDigests 0}}' "$tag" | tee -a dist/IMAGE_DIGESTS
            echo "::endgroup::"
          done < tofu-versions

      # `gh` rather than a third-party release action: it ships on the runner,
      # and publishing a file should not add a supply-chain dependency.
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            dist/truss-linux-amd64 dist/truss-linux-arm64 dist/SHA256SUMS dist/IMAGE_DIGESTS
